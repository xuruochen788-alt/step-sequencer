
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accessible Step Sequencer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Step Sequencer</h1>

    <p id="instructions">
        Use the arrow keys to move between notes.
        Moving left or right announces the step number
        and previews the pitch.
        Moving up or down previews the pitch only.
        Press Enter or Space to toggle a note.
        Use Tab to leave the sequencer.
    </p>

    <div id="sequencer">

        <div id="note-labels" aria-hidden="true"></div>

        <div
            id="grid"
            role="group"
            aria-label="16-step note sequencer">
        </div>

    </div>

    <p
    id="selection-status"
    role="status"
    aria-live="polite"
    aria-atomic="true">
    </p>

    <div class="controls">
        <button id="play" type="button">Play</button>
        <button id="stop" type="button">Stop</button>
    </div>

</div>

<script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
<script src="script.js"></script>

</body>
</html>
